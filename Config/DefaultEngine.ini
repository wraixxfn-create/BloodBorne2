[/Script/EngineSettings.GameMapsSettings]
; Step 2 plays from the clinic map; create /Game/BloodBorne2/Maps/Clinic_Sickroom
; in Step 1's Blueprint assembly and uncomment:
; EditorStartupMap=/Game/BloodBorne2/Maps/Clinic_Sickroom.Clinic_Sickroom
; GameDefaultMap=/Game/BloodBorne2/Maps/Clinic_Sickroom.Clinic_Sickroom
; GlobalDefaultGameMode=/Game/BloodBorne2/Blueprints/BP_BBGameMode.BP_BBGameMode_C

[/Script/Engine.CollisionSettings]
; Step 2 gameplay trace channels (referenced as ECC_BB_TARGETING /
; ECC_BB_INTERACTION in Core/BloodborneTypes.h).
; BBTargeting: lock-on LOS traces; world geometry should BLOCK it, lock-on
; candidates set their collision response to OVERLAP so they stay visible to
; the trace while remaining scannable.
; BBInteraction: reserved for Step 1-style interaction traces.
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel1,DefaultResponse=ECR_Block,bTraceType=True,bStaticObject=False,Name="BBTargeting")
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel2,DefaultResponse=ECR_Block,bTraceType=True,bStaticObject=False,Name="BBInteraction")
